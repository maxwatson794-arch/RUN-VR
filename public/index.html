<script>
const T=THREE,C=3,N=15,START=7*C;

scene.add(new T.AmbientLight(0x303048,.4));

const brickTex=tex(512,512,(x,w,h)=>{x.fillStyle='#2a1f1a';x.fillRect(0,0,w,h);for(let r=0;r<8;r++)for(let c=-1;c<5;c++){const px=c*128+(r%2)*64;x.fillStyle=`hsl(${15+Math.random()*12},${25+Math.random()*10}%,${22+Math.random()*14}%)`;x.fillRect(px+3,r*64+3,122,58)}
 for(let i=0;i<2500;i++){x.fillStyle=`rgba(0,0,0,${Math.random()*.25})`;x.fillRect(Math.random()*w,Math.random()*h,2,2)}});
const concTex=tex(256,256,(x,w,h)=>{x.fillStyle='#1c1a19';x.fillRect(0,0,w,h);for(let i=0;i<4000;i++){const g=20+Math.random()*25|0;x.fillStyle=`rgb(${g},${g-2},${g-4})`;x.fillRect(Math.random()*w,Math.random()*h,2,2)}x.strokeStyle='rgba(0,0,0,.5)';x.strokeRect(0,0,w,h)},15,15);
const stoneTex=tex(512,256,(x,w,h)=>{x.fillStyle='#3b4560';x.fillRect(0,0,w,h);for(let r=0;r<4;r++)for(let c=-1;c<4;c++){x.fillStyle=`hsl(225,${18+Math.random()*10}%,${28+Math.random()*10}%)`;x.fillRect(c*128+(r%2)*64+2,r*64+2,124,60)}
 for(let i=0;i<1500;i++){x.fillStyle=`rgba(0,0,0,${Math.random()*.2})`;x.fillRect(Math.random()*w,Math.random()*h,2,2)}});

 const sp=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),fog:false,transparent:true}));sp.scale.set(sx,sy,1);sp.position.set(x,y,z);scene.add(sp);return sp}

for(let i=0;i<N;i++){W[i]=[];for(let j=0;j<N;j++)W[i][j]=i==0||j==0||i==N-1||j==N-1||(R()<.2&&Math.hypot(i-7,j-7)>2.5)}

const solid=(x,z)=>{const i=Math.round(x/C),j=Math.round(z/C);
 if(i<0)return !inPlaza(x,z)||PIL.some(p=>Math.hypot(x-p[0],z-p[1])<.6);
 return j<0||i>=N||j>=N||W[i][j]};
const blocked=(x,z,r=.3)=>solid(x+r,z+r)||solid(x-r,z+r)||solid(x+r,z-r)||solid(x-r,z-r);

 if(!W[i][j]&&Math.hypot(i*C-START,j*C-START)>=minD)return new T.Vector3(i*C,0,j*C)}return new T.Vector3(C,0,C)}
const darkLights=new T.Group();for(let k=0;k<3;k++){const l=new T.PointLight(0xff2200,.5,10);l.position.copy(openCell(6));l.position.y=2.4;darkLights.add(l)}scene.add(darkLights);

 for(let i=0;i<21;i++)for(let j=0;j<18;j++){x.fillStyle=`hsl(185,${12+Math.random()*8}%,${16+Math.random()*7}%)`;x.fillRect(i*50+2,j*50+2,46,46)}
 const cx=(-16-PX0)/(PX1-PX0)*w,cy=h/2;x.lineWidth=4;
 [60,110,170].forEach((r,i)=>{x.strokeStyle=['#35e0ff','#ff4fd8','#35e0ff'][i];x.globalAlpha=.85;x.beginPath();x.arc(cx,cy,r,0,6.283);x.stroke()});
 x.globalAlpha=1;x.strokeStyle='#ff3344';x.setLineDash([18,14]);x.lineWidth=5;x.beginPath();x.moveTo(cx+190,cy);x.lineTo(w-70,cy);x.stroke();
 x.setLineDash([]);x.fillStyle='#ff3344';x.beginPath();x.moveTo(w-30,cy);x.lineTo(w-85,cy-26);x.lineTo(w-85,cy+26);x.fill()});
const pm=new T.MeshStandardMaterial({map:stoneTex,color:0xbbc4e8,roughness:.9}),pcx=(PX0+PX1)/2;
const capM=new T.MeshBasicMaterial({color:0x35e0ff,fog:false});
const wm=(rx,ry)=>{const t=stoneTex.clone();t.needsUpdate=true;t.repeat.set(rx,ry);return new T.MeshStandardMaterial({map:t,color:0xbbc4e8,roughness:.9})};
const pf=new T.Mesh(new T.PlaneGeometry(PX1-PX0,PZ*2),new T.MeshStandardMaterial({map:plazaTex,roughness:.8,metalness:.1}));
pf.rotation.x=-Math.PI/2;pf.position.set(pcx,0,START);scene.add(pf);
[[pcx,START-PZ,PX1-PX0,.4],[pcx,START+PZ,PX1-PX0,.4],[PX0,START,.4,PZ*2],[PX1,START,.4,PZ*2]].forEach(([x,z,w,d])=>{
 const m=new T.Mesh(new T.BoxGeometry(w,3.4,d),wm(Math.max(w,d)/2.5,1.4));m.position.set(x,1.7,z);scene.add(m);const cap=new T.Mesh(new T.BoxGeometry(w+.06,.1,d+.06),capM);cap.position.set(x,3.42,z);scene.add(cap)});
PIL.forEach(p=>{const m=new T.Mesh(new T.CylinderGeometry(.6,.6,3.4,16),pm);m.position.set(p[0],1.7,p[1]);scene.add(m);[.15,3.3].forEach(y=>{const r=new T.Mesh(new T.TorusGeometry(.64,.045,6,24),capM);r.rotation.x=Math.PI/2;r.position.set(p[0],y,p[1]);scene.add(r)})});
const plazaLight=new T.PointLight(0xffe9c8,1.3,40);plazaLight.position.set(pcx,5,START);scene.add(plazaLight);
{const a=new T.PointLight(0x35e0ff,1.1,22),b=new T.PointLight(0xff4fd8,1.1,22);a.position.set(-9,-2,-6);b.position.set(9,-2,6);plazaLight.add(a,b,new T.HemisphereLight(0x8aa0ff,0x223322,.7))}
const portal=new T.Group();
portal.add(new T.Mesh(new T.TorusGeometry(1.1,.08,12,32),new T.MeshBasicMaterial({color:0xff2233,fog:false})),
 new T.Mesh(new T.CircleGeometry(1.1,32),new T.MeshBasicMaterial({color:0x550008,fog:false,transparent:true,opacity:.6,side:T.DoubleSide})));
portal.rotation.y=Math.PI/2;portal.position.set(PX1-.6,1.4,START);scene.add(portal);
{const rl=new T.PointLight(0xff2233,1.4,12);rl.position.set(PX1-1.5,1.4,START);plazaLight.add(rl);rl.position.sub(plazaLight.position)}
// shop + cosmetics
const SKINS={ape:{c:0x6b4a32,e:0},ghost:{c:0xbfd6ff,e:0x3a5a99},lava:{c:0x551100,e:0xff4400},toxic:{c:0x113311,e:0x33ff55},gold:{c:0xffcc33,e:0x886600},void:{c:0x050008,e:0x7a22ff}};
const TCOL={ember:0xff7722,ice:0x88eeff,rainbow:0xff44ff},gearCol={glove:0xff8844,beam:0xffd070,magnet:0x44ddff};
const eqLook=()=>eq.skin+'|'+eq.hat+'|'+eq.trail;
function hatMesh(id){const g=new T.Group(),gm=new T.MeshStandardMaterial({color:0xffcc33,emissive:0x664400,metalness:.6,roughness:.3,side:T.DoubleSide});
 if(id==='crown'){g.add(new T.Mesh(new T.CylinderGeometry(.1,.085,.07,10,1,true),gm));
  for(let k=0;k<5;k++){const c=new T.Mesh(new T.ConeGeometry(.02,.07,5),gm),an=k/5*6.283;c.position.set(Math.cos(an)*.09,.06,Math.sin(an)*.09);g.add(c)}}
 else if(id==='horns'){const hm=new T.MeshStandardMaterial({color:0xaa1111,emissive:0x440000});[-1,1].forEach(q=>{const c=new T.Mesh(new T.ConeGeometry(.03,.17,8),hm);c.position.set(q*.09,.08,0);c.rotation.z=-q*.45;g.add(c)})}
 else if(id==='halo'){const h=new T.Mesh(new T.TorusGeometry(.11,.012,8,24),new T.MeshBasicMaterial({color:0xffee66,fog:false}));h.rotation.x=Math.PI/2;h.position.y=.17;g.add(h)}
 else if(id==='party'){const c=new T.Mesh(new T.ConeGeometry(.08,.2,12),new T.MeshStandardMaterial({color:0xff44aa,emissive:0x550022}));c.position.y=.1;g.add(c)}
 return g}
const mk=(id,slot,name,price,x,z)=>({id,slot,name,price,x,z});
const items=[
 mk('glove','gear','Speed Gloves',15,-24,START-7),mk('beam','gear','Gold Light',10,-24,START-4.5),mk('magnet','gear','Orb Magnet',20,-24,START-2),
 mk('ember','trail','Ember Trail',10,-24,START+2),mk('ice','trail','Ice Trail',10,-24,START+4.5),mk('rainbow','trail','Rainbow Trail',20,-24,START+7),
 mk('ghost','skin','Ghost Skin',8,-22,START-7.5),mk('lava','skin','Lava Skin',12,-19,START-7.5),mk('toxic','skin','Toxic Skin',12,-16,START-7.5),mk('gold','skin','Gold Skin',25,-13,START-7.5),mk('void','skin','Void Skin',30,-10,START-7.5),
 mk('crown','hat','Crown',20,-22,START+7.5),mk('horns','hat','Devil Horns',15,-19,START+7.5),mk('halo','hat','Halo',15,-16,START+7.5),mk('party','hat','Party Hat',5,-13,START+7.5)];
items.forEach(it=>{const ped=new T.Mesh(new T.CylinderGeometry(.35,.4,.9,16),pm);ped.position.set(it.x,.45,it.z);scene.add(ped);
 {const rc={skin:0xff4fd8,hat:0xffd23f,trail:0x35e0ff,gear:0x66ff88}[it.slot];[.04,.93].forEach(y=>{const r=new T.Mesh(new T.TorusGeometry(.42,.02,6,24),new T.MeshBasicMaterial({color:rc,fog:false}));r.rotation.x=Math.PI/2;r.position.set(it.x,y,it.z);scene.add(r)})}
 it.pos=new T.Vector3(it.x,1.2,it.z);let m;
 if(it.slot==='skin'){const S=SKINS[it.id];m=new T.Mesh(new T.SphereGeometry(.14,16,12),new T.MeshStandardMaterial({color:S.c,emissive:S.e,emissiveIntensity:.9,metalness:it.id==='gold'?.7:0}))}
 else if(it.slot==='hat'){m=hatMesh(it.id);m.scale.setScalar(1.7)}
 else m=new T.Mesh(it.slot==='trail'?new T.IcosahedronGeometry(.1):new T.OctahedronGeometry(.16),new T.MeshBasicMaterial({color:it.slot==='trail'?TCOL[it.id]:gearCol[it.id],fog:false}));
 m.position.copy(it.pos);scene.add(m);it.mesh=m;
 it.cv=document.createElement('canvas');it.cv.width=256;it.cv.height=128;it.tex=new T.CanvasTexture(it.cv);
 it.sp=new T.Sprite(new T.SpriteMaterial({map:it.tex,fog:false}));it.sp.scale.set(1.3,.65,1);it.sp.position.set(it.x,2.1,it.z);scene.add(it.sp);relabel(it)});
function relabel(it){const x=it.cv.getContext('2d'),on=eq[it.slot]===it.id,st=!owned[it.id]?it.price+' coins':it.slot==='gear'?'OWNED':on?'EQUIPPED':'OWNED';
 x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,0,256,128);x.textAlign='center';x.fillStyle='#8899aa';x.font='18px Georgia';x.fillText(it.slot.toUpperCase(),128,26);
 x.fillStyle='#fff';x.font='bold 26px Georgia';x.fillText(it.name,128,62);x.fillStyle=!owned[it.id]?'#fc4':on?'#6cf':'#6f6';x.font='28px Georgia';x.fillText(st,128,104);it.tex.needsUpdate=true}
let buyCd=0;
function use(it){if(buyCd>0)return;buyCd=1;const had=!!owned[it.id];
 if(!had){if(coins<it.price){setMsg('Need '+it.price+' coins');return}coins-=it.price;owned[it.id]=1;thump(.8);burst(it.pos,'rainbow');setMsg('Bought '+it.name)}
 if(it.slot!=='gear'){if(had&&eq[it.slot]===it.id){eq[it.slot]=it.slot==='skin'?'ape':'none';setMsg('Unequipped')}else{eq[it.slot]=it.id;if(had)setMsg('Equipped '+it.name)}}
 else if(had)return;
 save();applyGear();items.forEach(relabel);rebuildStatue()}

 if(owned.beam){spot.color.set(0xffd070);spot.angle=.6;spot.distance=34}}
// statue shows your current look

const sc=document.createElement('canvas');sc.width=256;sc.height=64;{const x=sc.getContext('2d');x.fillStyle='#fff';x.font='bold 34px Georgia';x.textAlign='center';x.fillText('YOUR LOOK',128,44)}
const sSp=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(sc),fog:false}));sSp.scale.set(1.6,.4,1);sSp.position.set(-16,2.4,START);scene.add(sSp);

// neon, portal rings, stars, moon

portal.add(ring2);
[START-PZ+.3,START+PZ-.3].forEach(z=>{const n=new T.Mesh(new T.BoxGeometry(PX1-PX0-.6,.08,.08),neonM);n.position.set(pcx,.05,z);scene.add(n)});
{const sg=new T.BufferGeometry(),sp=new Float32Array(4500);for(let i=0;i<1500;i++){const th=Math.random()*6.283,ph=Math.acos(Math.random()*.9+.1);

 const moon=new T.Mesh(new T.SphereGeometry(14,24,16),new T.MeshBasicMaterial({color:0xe8ecff,fog:false}));moon.position.set(START-120,110,START-230);scene.add(moon);const mg=new T.Sprite(new T.SpriteMaterial({map:glowTex,color:0xbfd0ff,fog:false,transparent:true,blending:T.AdditiveBlending,depthWrite:false}));mg.scale.set(90,90,1);mg.position.copy(moon.position);scene.add(mg)}
const sky=(()=>{const g=new T.SphereGeometry(350,24,16),pos=g.attributes.position,col=new Float32Array(pos.count*3),c1=new T.Color(0xff8a6b),c2=new T.Color(0x5a3f9a),c3=new T.Color(0x0a0e2e),c=new T.Color();
 for(let i=0;i<pos.count;i++){const q=Math.max(0,pos.getY(i)/350);if(q<.25)c.copy(c1).lerp(c2,q/.25);else c.copy(c2).lerp(c3,Math.min(1,(q-.25)/.5));col.set([c.r,c.g,c.b],i*3)}

 const u=(tp.x+.9)/1.8*720,v=(.525-tp.y)/1.05*420,r=Math.floor((v-130)/58);if(r<0||r>4)return -1;
 return r===4?100+Math.min(2,Math.floor(u/240)):r*9+Math.min(8,Math.floor(u/80))}
function pressKey(k){if(k<0)return;lastKey=k<36?k:-1;
 if(k<36){if(code.length<8)code+=KEYS[k]}else if(k===100)code=code.slice(0,-1);else if(k===101)joinPress();else leavePress();thump(.3);drawTerm()}

async function joinCode(c){if(joining)return;

 if(!room){termMsg='OFFLINE · SERVER NOT CONNECTED';drawTerm();return}
 joining=true;termMsg='JOINING...';drawTerm();
 try{const nr=await room.join('gt-'+c.toLowerCase()),old=cur;bind(nr,c);if(old&&old!==room)old.leave().catch(()=>{});
  room.presence({p:null,l:null,r:null}).catch(()=>{});termMsg='JOINED '+c;setMsg('Joined room '+c)}
 catch(e){termMsg='COULD NOT JOIN'}joining=false;drawTerm()}

 else{if(keys.KeyC&&!cHeld&&Math.hypot(P.x+8.4,P.z-START-6)<2.5){cHeld=true;document.exitPointerLock&&document.exitPointerLock();const c=prompt('Room code or promo code:');keys.KeyC=0;

// floating coins
const pcoins=[[-20,-3,1.4],[-20,3,1.4],[-12,0,2.6],[-14,-7,.8],[-14,6,3],[-8,-3,1.4],[-8,3,2.2],[-22,0,2.8]].map(([x,dz,y])=>{

// tag mode: only in a code room, in the plaza (infection style)
function tagUpdate(dt){
 const off=!cur||cur===room||zone!=='safe'||state!=='play';
 if(off){if(meIt){meIt=false;handM.color.set(0x3a2a20)}tagMsg='';return}
 const me=curPeers.find(p=>p.isMe),others=curPeers.filter(p=>!p.isMe&&p.presence&&Array.isArray(p.presence.p)&&p.presence.zn!==1);
 if(!others.length){meIt=false;tagWait=0;tagMsg='WAITING FOR PLAYERS';handM.color.set(0x3a2a20);return}
 const P=head(),itO=others.filter(o=>o.presence.it===1),anyIt=meIt||itO.length>0;
 others.forEach(o=>{const now=o.presence.it===1;if(now&&!prevIt[o.peer]&&meIt&&v3(o.presence.p).distanceTo(P)<1.6){coins+=2;save();setMsg('TAG! +2 coins')}prevIt[o.peer]=now});
 if(meIt&&itO.length===others.length){allT+=dt;tagMsg='ROUND OVER';if(allT>4){meIt=false;allT=0}}else allT=0;
 if(!anyIt){tagWait+=dt;tagMsg='STARTING...';if(tagWait>3){const ids=[me?me.peer:'~',...others.map(o=>o.peer)].sort();if(me&&ids[0]===me.peer){meIt=true;setMsg('YOU ARE IT!')}tagWait=0}}else tagWait=0;
 if(!meIt&&itO.length&&itO.some(o=>[o.presence.p,o.presence.l,o.presence.r].some(a=>Array.isArray(a)&&v3(a).distanceTo(P)<.6))){meIt=true;setMsg('TAGGED! YOU ARE IT');thump(.9)}
 if(anyIt&&!(meIt&&itO.length===others.length))tagMsg=meIt?'YOU ARE IT!':'RUN!';
 if(!meIt&&anyIt){surv+=dt;if(surv>=10){surv=0;coins++;save();setMsg('+1 SURVIVED')}}else surv=0;
 handM.color.set(meIt?0xff3300:0x3a2a20)}

 const inXR=renderer.xr.isPresenting;if(!inXR)camera.position.set(0,1.6,0);

   if(!blocked(h.x+dx,h.z))rig.position.x+=dx;if(!blocked(head().x,h.z+dz))rig.position.z+=dz}
  const P=head();tagUpdate(dt);

    const near=inXR?handW.some(h=>h.distanceTo(it.pos)<.25):(keys.KeyE&&Math.hypot(P.x-it.pos.x,P.z-it.pos.z)<1.4);

  else{

    const u=m.userData;let ux=ex/d,uz=ez/d;if(u.wander>0){u.wander-=dt;ux=Math.sin(u.wdir);uz=Math.cos(u.wdir)}

   spot.intensity=nearD<9&&Math.random()<.08?.3:2.4;
   for(const o of orbs)if(o.visible){o.position.y=1.1+Math.sin(performance.now()/400+o.id)*.08;
    if(Math.hypot(P.x-o.position.x,P.z-o.position.z)<orbR){o.visible=false;got++;coins++;save();thump(.8);burst(o.position,'ice');if(got===5)exitM.visible=true}}
   if(got===5&&Math.hypot(P.x-exitPos.x,P.z-exitPos.z)<1.2){coins+=5;save();toPlaza();setMsg('ESCAPED  +5 coins')}
   if(ac&&performance.now()/1000>nextBeat){const iv=Math.min(1.1,Math.max(.35,nearD/18));thump(.5);setTimeout(()=>thump(.35),150);nextBeat=performance.now()/1000+iv}}}
